<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark the Circuit - AI Troubleshooting Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 30px; line-height: 1.6; }
        .container { max-width: 1000px; margin: 0 auto; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #38bdf8; text-decoration: none; font-weight: bold; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #38bdf8; font-size: 2.8rem; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 1.1rem; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 30px; box-shadow: 0 10px 15px rgba(0,0,0,0.3); margin-bottom: 25px; }
        .card h2 { color: #38bdf8; margin-bottom: 15px; font-size: 1.5rem; }
        textarea { width: 100%; height: 130px; background: #162032; border: 1px solid #334155; color: #fff; padding: 15px; border-radius: 8px; font-size: 1rem; outline: none; resize: vertical; margin-bottom: 15px; }
        .btn { background: #0284c7; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
        .btn:hover { background: #0369a1; }
        .response-box { background: #0b0f19; border: 1px solid #334155; border-left: 4px solid #38bdf8; padding: 20px; border-radius: 8px; color: #cbd5e1; font-family: 'Courier New', monospace; font-size: 0.95rem; margin-top: 15px; line-height: 1.6; white-space: pre-wrap; }
    </style>
    <script>
        function runAiTroubleshooter() {
            let errorText = document.getElementById('errorInput').value.trim();
            let box = document.getElementById('aiResponse');
            if(!errorText) {
                box.innerText = "⚠️ Please describe your error or circuit symptom first.";
                return;
            }
            let lower = errorText.toLowerCase();
            let response = "🤖 [Spark AI Diagnostic Report]\n\n";
            
            if(lower.includes('upload') || lower.includes('com') || lower.includes('stk500') || lower.includes('timeout')) {
                response += "• Issue Detected: Microcontroller Upload or Serial Communication Failure.\n";
                response += "• Recommended Remedial Measures:\n";
                response += "  1. Verify your USB cable supports data transfer (replace charge-only cables).\n  2. Check your Arduino IDE settings: Ensure correct board model and COM port are selected.\n  3. Download and install the appropriate USB VCP driver (CH340 or CP210x) from our Drivers Hub.";
            } else if(lower.includes('led') || lower.includes('burn') || lower.includes('smoke') || lower.includes('hot')) {
                response += "• Issue Detected: Thermal overload or overcurrent condition.\n";
                response += "• Recommended Remedial Measures:\n";
                response += "  1. Disconnect power immediately to prevent hardware damage.\n  2. Ensure a proper current-limiting resistor (e.g., 220Ω) is wired in series with LEDs.\n  3. Double-check your supply voltage levels against component specifications.";
            } else {
                response += "• Issue Detected: General Circuit / Firmware Fault.\n";
                response += "• Recommended Remedial Measures:\n";
                response += "  1. Check all GND connections and ensure a common ground is shared across modules.\n  2. Verify pin mappings and power rails (3.3V vs 5V logic compatibility).\n  3. Inspect wiring connections on the 3D Virtual Workbench.";
            }
            box.innerText = response;
        }
    </script>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-btn">← Back to Homepage</a>
    <header>
        <h1>🔧 AI Hardware Troubleshooting Assistant</h1>
        <p>Describe your circuit error or upload failure and get expert AI diagnostic measures instantly.</p>
    </header>
    <div class="card">
        <h2>Describe Error, Code Failure, or Symptom</h2>
        <textarea id="errorInput" placeholder="e.g., stk500_getsync() attempt failed or my sensor is returning 0..."></textarea>
        <button class="btn" onclick="runAiTroubleshooter()">🔍 Analyze & Get Remedial Measures</button>
        <div class="response-box" id="aiResponse">Awaiting error description for diagnostics...</div>
    </div>
</div>
</body>
</html>
