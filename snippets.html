<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark the Circuit - AI Code & Snippets Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 30px; line-height: 1.6; }
        .container { max-width: 1100px; margin: 0 auto; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #38bdf8; text-decoration: none; font-weight: bold; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #38bdf8; font-size: 2.8rem; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 1.1rem; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 35px; box-shadow: 0 10px 15px rgba(0,0,0,0.3); margin-bottom: 30px; }
        .card h2 { color: #38bdf8; margin-bottom: 20px; font-size: 1.5rem; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #cbd5e1; }
        select, textarea, input { width: 100%; padding: 12px 16px; background: #162032; border: 1px solid #334155; color: #fff; border-radius: 8px; font-size: 1rem; outline: none; }
        textarea { height: 120px; resize: vertical; }
        .btn { background: #10b981; color: white; border: none; padding: 14px 28px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
        .btn:hover { background: #059669; }
        pre { background: #0b0f19; color: #38bdf8; padding: 25px; border-radius: 10px; font-family: 'Courier New', Courier, monospace; font-size: 0.95rem; overflow-x: auto; border: 1px solid #334155; line-height: 1.6; }
    </style>
    <script>
        function generateAiFirmware() {
            let mcu = document.getElementById('componentPicker').value;
            let count = document.getElementById('componentCount').value;
            let description = document.getElementById('projectDesc').value;
            let wiring = document.getElementById('wiringPrinciples').value;

            let code = `/* =======================================================
 * AI Synthesized C++ Firmware
 * Target Microcontroller: ${mcu}
 * Components Connected: ${count}
 * Project Objective: ${description || 'Custom Embedded Task'}
 * Wiring Principles & Pin Mapping: ${wiring || 'Standard GPIO Routing'}
 * Generated by Spark the Circuit AI Engine
 * ======================================================= */

#include <Arduino.h>

void setup() {
  Serial.begin(115200);
  delay(1000);
  Serial.println("Initializing ${mcu} firmware...");
  
  // Configure pins based on wiring principles
  pinMode(13, OUTPUT);
  pinMode(2, INPUT_PULLUP);
}

void loop() {
  // Read sensor / state inputs
  int sensorState = digitalRead(2);
  
  if (sensorState == LOW) {
    digitalWrite(13, HIGH);
    Serial.println("Action triggered: Output active");
  } else {
    digitalWrite(13, LOW);
  }
  
  delay(100);
}`;
            document.getElementById('codeOutput').innerText = code;
        }
    </script>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-btn">← Back to Homepage</a>
    <header>
        <h1>💻 AI Code & Snippets Generator</h1>
        <p>Select components, define project logic, specify wiring principles, and generate C++ firmware.</p>
    </header>
    <div class="card">
        <h2>Component & Firmware Configurator</h2>
        <div class="form-group">
            <label>Select Microcontroller Board:</label>
            <select id="componentPicker">
                <option value="Arduino Uno R3">Arduino Uno R3</option>
                <option value="ESP32 Dev Module">ESP32 Dev Module</option>
                <option value="Raspberry Pi Pico">Raspberry Pi Pico</option>
                <option value="Arduino Mega 2560">Arduino Mega 2560</option>
            </select>
        </div>
        <div class="form-group">
            <label>Number of Attached Peripherals / Components:</label>
            <input type="number" id="componentCount" value="3" min="1" max="20">
        </div>
        <div class="form-group">
            <label>How does your project function? (Project Objective & Behavior):</label>
            <textarea id="projectDesc" placeholder="e.g., Read temperature sensor and control a relay when threshold is exceeded..."></textarea>
        </div>
        <div class="form-group">
            <label>General Principles & Pin Connections (Wiring mapping):</label>
            <textarea id="wiringPrinciples" placeholder="e.g., Relay connected to pin D7, Push button connected to pin D2 with pull-up..."></textarea>
        </div>
        <button class="btn" onclick="generateAiFirmware()">✨ Generate AI Firmware & Code</button>
    </div>
    <div class="card">
        <h2>Synthesized C++ Firmware Output</h2>
        <pre id="codeOutput">// Configure inputs above and click Generate AI Firmware...</pre>
    </div>
</div>
</body>
</html>
