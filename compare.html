<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark the Circuit - 50 Boards Comparison Matrix & Power Evaluator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 30px; line-height: 1.6; }
        .container { max-width: 1350px; margin: 0 auto; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #38bdf8; text-decoration: none; font-weight: bold; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #38bdf8; font-size: 2.8rem; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 1.1rem; }
        .evaluator-card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 30px; margin-bottom: 40px; box-shadow: 0 10px 15px rgba(0,0,0,0.3); }
        .evaluator-card h2 { color: #38bdf8; margin-bottom: 15px; font-size: 1.5rem; }
        .eval-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 20px; align-items: flex-end; }
        @media(max-width: 850px) { .eval-grid { grid-template-columns: 1fr; } }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #cbd5e1; font-size: 0.95rem; }
        select { width: 100%; padding: 12px 15px; background: #162032; color: #fff; border: 1px solid #334155; border-radius: 8px; font-size: 1rem; outline: none; }
        .winner-box { margin-top: 20px; padding: 15px 20px; background: #162032; border-left: 4px solid #10b981; border-radius: 8px; font-weight: bold; color: #38bdf8; font-size: 1.1rem; }
        .table-container { background: #1e293b; border: 1px solid #334155; border-radius: 14px; overflow-x: auto; box-shadow: 0 10px 15px rgba(0,0,0,0.3); max-height: 550px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 14px 18px; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        th { background: #162032; color: #38bdf8; font-weight: 700; position: sticky; top: 0; z-index: 10; }
        tr:hover { background: #26334d; }
    </style>

            {name: "Freedom KL25Z Board", cpu: "NXP KL25Z", mhz: 48, flash: "128 KB", ram: "16 KB", voltage: "3.3V", wireless: "None"},
            {name: "Arduino Nano Clone CH340", cpu: "ATmega328P", mhz: 16, flash: "32 KB", ram: "2 KB", voltage: "5V", wireless: "None"},
            {name: "Arduino Uno Clone CH340", cpu: "ATmega328P", mhz: 16, flash: "32 KB", ram: "2 KB", voltage: "5V", wireless: "None"},
            {name: "ESP-01 / ESP-01S", cpu: "ESP8266EX", mhz: 80, flash: "1 MB", ram: "80 KB", voltage: "3.3V", wireless: "Wi-Fi"}
        ];

        window.onload = function() {
            let select1 = document.getElementById('board1Select');
            let select2 = document.getElementById('board2Select');
            let tbody = document.getElementById('matrixBody');
            boardsData.forEach((b, idx) => {
                let opt1 = document.createElement('option');
                opt1.value = idx; opt1.innerText = b.name;
                select1.appendChild(opt1);
                let opt2 = document.createElement('option');
                opt2.value = idx; opt2.innerText = b.name;
                select2.appendChild(opt2);
                let tr = document.createElement('tr');
                tr.innerHTML = `<td><strong>${b.name}</strong></td><td>${b.cpu}</td><td>${b.mhz} MHz</td><td>${b.flash}</td><td>${b.ram}</td><td>${b.voltage}</td><td>${b.wireless}</td>`;
                tbody.appendChild(tr);
            });
        };

        function compareBoardsPower() {
            let b1 = boardsData[document.getElementById('board1Select').value];
            let b2 = boardsData[document.getElementById('board2Select').value];
            document.getElementById('evalResult').innerText = b1.mhz >= b2.mhz ? `🏆 Winner: ${b1.name} (${b1.mhz} MHz)` : `🏆 Winner: ${b2.name} (${b2.mhz} MHz)`;
        }
    </script>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-btn">← Back to Homepage</a>
    <header>
        <h1>📊 50-Board Comparison Matrix & Power Evaluator</h1>
        <p>Comprehensive side-by-side processing power evaluation across all 50 microcontrollers.</p>
    </header>
    <div class="evaluator-card">
        <h2>⚡ Interactive Power Evaluator</h2>
        <div class="eval-grid">
            <div class="form-group"><label>Board A:</label><select id="board1Select"></select></div>
            <div class="form-group"><label>Board B:</label><select id="board2Select"></select></div>
            <div><button class="btn" onclick="compareBoardsPower()">Compare Power</button></div>
        </div>
        <div class="winner-box" id="evalResult">Select boards to evaluate performance...</div>
    </div>
    <div class="table-container">
        <table>
            <thead>
                <tr><th>Name</th><th>CPU / Core</th><th>Clock Speed</th><th>Flash Memory</th><th>SRAM</th><th>Operating Voltage</th><th>Wireless</th></tr>
            </thead>
            <tbody id="matrixBody"></tbody>
        </table>
    </div>
</div>
</body>
</html>
